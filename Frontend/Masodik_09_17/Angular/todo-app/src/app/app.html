<h1>Hello Angular</h1>
<hr>
<input type="text" placeholder="Szöveg..." [(ngModel)]="newTodo.content"><br>
<button (click)="add()">Hozzáad</button>
<hr>
<div *ngFor="let item of todos">
  <p (click)="mark(item)" [ngClass]="item.done ? 'finished' : ''">
    {{ item.content }}
  </p>
</div>
